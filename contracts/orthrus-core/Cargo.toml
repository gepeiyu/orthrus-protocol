[package]
name = "orthrus-core"
version = "0.1.0"
edition = "2021"
description = "On-chain policy engine & execution sandboxed contract for AI Agents on NEAR"
repository = "https://github.com/gepeiyu/orthrus-protocol"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy"] }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing", "legacy"] }
